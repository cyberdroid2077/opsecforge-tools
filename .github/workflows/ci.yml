name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: true
        # Known pre-existing issues tracked in .eslintignore — CI reports but does not block

      - name: TypeScript check
        run: npm run typecheck

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities in lockfile
        run: npm audit --package-lock-only --audit-level=high
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        # Test dependencies are already installed from package-lock.json by npm ci.
        # Never re-resolve or mutate dependencies inside the verification job.
        run: npm test -- --reporter=verbose

      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json

  monitor:
    name: Runtime Health Check
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run health check script
        run: |
          node --experimental-vm-modules scripts/monitor/health-check.js || true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, audit, build, test, monitor]
    if: failure() && github.event_name == 'push'
    steps:
      - name: Summary
        run: |
          echo "## :warning: OpsecForge CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline failed on ${{ github.ref }}. Check the artifacts for details." >> $GITHUB_STEP_SUMMARY
